[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-flood-ml"
version = "0.1.0"
description = "Config-driven SAR flood mapping ML framework for multiple sites."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "rasterio>=1.3",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
vector = ["geopandas>=0.14"]
xgboost = ["xgboost>=2.0"]
cnn = ["tensorflow>=2.15"]
all = ["geopandas>=0.14", "xgboost>=2.0", "tensorflow>=2.15"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
